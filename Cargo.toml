[package]
name = "oxydemark"
version = "0.2.0"
authors = ["Axel H. <noirbizarre@users.noreply.github.com>"]
edition = "2024"
# Effective floor: `src/extensions.rs` uses let-chains, stabilised in 1.88
# (edition 2024 alone would only require 1.85, the `rushdown*` dependencies
# 1.87). Declaring it gives downstream users a clean resolver error instead of
# a mid-build type error.
rust-version = "1.88"
description = "Extensible Markdown pipelines powered by Rust"
license = "MIT"
repository = "https://github.com/noirbizarre/oxydemark"
homepage = "https://noirbizarre.github.io/oxydemark/"
documentation = "https://docs.rs/oxydemark"
readme = "README.md"
keywords = ["extensible", "markdown", "pipeline", "ast", "pyo3"]
categories = ["text-processing", "parser-implementations"]
# Allow-list trimming the published tarball to the sources. Note that `LICENSE`
# is not shipped automatically (we declare an SPDX `license`, not a
# `license-file`), hence the explicit entry.
#
# CAUTION: maturin's default `sdist-generator = "cargo"` derives the PyPI sdist
# file list from `cargo package --list`, so `python/**` and `pyproject.toml`
# must stay included (OMEP-0009).
include = [
    "/src/**/*.rs",
    "/tests/public_api.rs",
    "/python/**/*.py",
    "/python/**/*.pyi",
    "/python/oxydemark/py.typed",
    "/pyproject.toml",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

# docs.rs builds with the default (PyO3-free) feature set, which is exactly the
# surface downstream crates consume (OMEP-0008 / OMEP-0011).
[package.metadata.docs.rs]
all-features = false

[lib]
name = "oxydemark"
crate-type = ["cdylib", "rlib"]

[features]
# No default features: a plain `cargo build` and downstream `oxydemark = "..."`
# dependency is 100% PyO3-free (issue #20).
default = []
# Builds the PyO3 binding layer (`#[pyclass]`/`#[pyfunction]`/`#[pymodule]`).
# This alone links against libpython, so `cargo test --features python` works
# with the `auto-initialize` dev-dependency.
python = ["dep:pyo3"]
# Adds `extension-module` linkage on top of `python` for building the wheel.
# maturin activates this feature (see `pyproject.toml`); it must NOT be used
# for `cargo test` because the test harness needs to link libpython itself.
#
# `abi3-py312` is gated here rather than on `python` on purpose: the wheel is
# built against the stable ABI (one `cp312-abi3` artifact per platform covering
# Python 3.12+, OMEP-0009), while `cargo test --features python` keeps the
# version-specific ABI required by the `auto-initialize` dev-dependency.
extension-module = ["python", "pyo3/extension-module", "pyo3/abi3-py312"]

[dependencies]
pyo3 = { version = "0.28", optional = true }
rushdown = "0.18"
# CAUTION: `rushdown-meta`/`rushdown-emoji` bump their own `rushdown`
# requirement across *patch* releases (0.9.3 -> ^0.11, 0.9.9 -> ^0.18), so a
# caret requirement here silently pulls a second, incompatible `rushdown` into
# a downstream graph (issue #33). The exact pin is the only faithful expression
# of the constraint: moving `rushdown` is a deliberate, released decision --
# `rushdown::ast::Meta` is part of oxydemark's public API, so a `rushdown` major
# bump is a breaking change for us too.
rushdown-meta = "=0.9.9"
rushdown-emoji = "=0.9.8"
unicode-normalization = "0.1"

[dev-dependencies]
# Enable the embedded Python interpreter so the feature-gated `#[cfg(test)]`
# tests that touch the PyO3 API (e.g. `meta_to_py`) can run under
# `cargo test --features python` / `cargo nextest run --features python`.
pyo3 = { version = "0.28", features = ["auto-initialize"] }
# Drive the JSON compliance fixtures in `tests/compliance/` (OMEP-0007
# Phase 3). Dev-dependencies are never built for downstream consumers of the
# crate and never linked into the wheel, so this does not grow the shipped
# artefacts. The fixtures themselves stay out of the `include` allow-list above.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already a regular dependency; re-declared so `tests/compliance.rs` can name
# `rushdown::ast::Meta` when matching typed component props. Cargo unifies both
# requirements to a single version.
rushdown = "0.18"
