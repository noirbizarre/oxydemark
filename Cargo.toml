[package]
name = "oxydemark"
version = "0.1.0"
edition = "2024"
description = "Extensible Markdown pipelines powered by Rust"
license = "MIT"
repository = "https://github.com/noirbizarre/oxydemark"
readme = "README.md"
keywords = ["extensible", "markdown", "pipeline", "ast", "pyo3"]
categories = ["text-processing", "parser-implementations"]

[lib]
name = "oxydemark"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.28"
rushdown = "0.11"
rushdown-meta = "0.9"
rushdown-emoji = "0.9"
unicode-normalization = "0.1"

[dev-dependencies]
# Enable the embedded Python interpreter so `#[cfg(test)]` tests that touch the
# PyO3 API (e.g. `meta_to_py`) can run under `cargo test` / `cargo nextest`.
pyo3 = { version = "0.28", features = ["auto-initialize"] }
