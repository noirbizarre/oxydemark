[tools]
rust = "stable"
python = "3.12"
prek = "latest"
cargo-binstall = "latest"
git-cliff = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-llvm-cov" = "latest"
# Used by the pre-commit hook and, more subtly, by `cliff.toml`'s
# `replace_command` preprocessor: commit subjects cannot be amended once
# pushed, so the changelog fixes their typos at render time.
"cargo:typos-cli" = "latest"

[tasks.build]
description = "Build the Rust crate"
run = "cargo build"

[tasks.test]
description = "Run the Rust test suite with nextest (pure-Rust, no python feature)"
run = "cargo nextest run"

[tasks."test:features"]
description = "Run the Rust test suite with the python feature enabled"
run = "cargo nextest run --features python"

[tasks."test:python"]
description = "Run the Python test suite with pytest"
run = "uv run --group test pytest"

[tasks."test:all"]
description = "Run both Rust and Python test suites"
depends = ["test", "test:features", "test:python"]

[tasks.typecheck]
description = "Type-check the Python package with ty"
run = "uv run --group typing ty check"

[tasks.lint]
description = "Run clippy lints in both feature configurations"
run = [
  "cargo clippy --all-targets -- -D warnings",
  "cargo clippy --all-targets --features python -- -D warnings",
]

[tasks.fmt]
description = "Format Rust source code"
run = "cargo fmt"

[tasks."fmt:check"]
description = "Check Rust formatting without modifying files"
run = "cargo fmt -- --check"

[tasks.changelog]
description = "Generate the full CHANGELOG.md for the next version"
run = "git cliff --bump --output CHANGELOG.md"

[tasks."changelog:preview"]
description = "Preview the release notes for the next version"
run = "git cliff --unreleased --bump --strip all"

[tasks.typos]
description = "Spell-check sources, docs and commit messages"
run = "typos"

[tasks."release:preview"]
description = "Dry-run the release preparation and render the Release PR"
run = "gh ship preview"

[tasks.ci]
description = "Run all CI checks locally"
depends = ["fmt:check", "lint", "test", "test:features", "test:python", "typecheck", "typos"]

[tasks.setup]
description = "Install pre-commit hooks via prek"
run = "prek install"

[tasks.cover]
description = "Generate the Rust coverage report (both feature configurations)"
# Both configurations are measured and merged: the binding layer (`src/python.rs`)
# is compiled out of the default build, so a single-configuration run reports it
# as entirely uncovered (OMEP-0012).
run = [
  "cargo llvm-cov clean --workspace",
  "cargo llvm-cov nextest --no-report",
  "cargo llvm-cov nextest --no-report --features python",
  "cargo llvm-cov report --lcov --output-path lcov.info",
]

[tasks."cover:python"]
description = "Generate the Python coverage report"
run = "uv run --group test pytest --cov --cov-report=xml --cov-report=term"

[tasks."cover:all"]
description = "Generate both the Rust and Python coverage reports"
depends = ["cover", "cover:python"]

[tasks."publish:check"]
description = "Verify the crate packages cleanly for crates.io (mirrors CI)"
run = [
  "cargo package --list --allow-dirty",
  "cargo publish --dry-run --allow-dirty --locked",
]

[tasks.bench]
description = "Run Python benchmarks comparing Markdown libraries"
run = "uv run --group bench pytest benchmarks/ --benchmark-only"

[tasks."docs:rust"]
description = "Generate the rustdoc API reference for the crate"
run = "cargo doc --no-deps"

[tasks."docs:python"]
description = "Build the Zensical documentation site into site/"
run = "uv run --group docs zensical build --clean"

[tasks.docs]
description = "Build the full documentation site, including the rustdoc reference"
depends = ["docs:python", "docs:rust"]
run = [
  "rm -rf site/rust",
  "cp -R target/doc site/rust",
]

[tasks."docs:serve"]
description = "Serve the documentation site locally with live reload"
run = "uv run --group docs zensical serve"
