[tools]
rust = "stable"
python = "3.12"
prek = "latest"
cargo-binstall = "latest"
git-cliff = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-llvm-cov" = "latest"

[tasks.build]
description = "Build the Rust crate"
run = "cargo build"

[tasks.test]
description = "Run the Rust test suite with nextest (pure-Rust, no python feature)"
run = "cargo nextest run"

[tasks."test:features"]
description = "Run the Rust test suite with the python feature enabled"
run = "cargo nextest run --features python"

[tasks."test:python"]
description = "Run the Python test suite with pytest"
run = "uv run --group test pytest"

[tasks."test:all"]
description = "Run both Rust and Python test suites"
depends = ["test", "test:features", "test:python"]

[tasks.typecheck]
description = "Type-check the Python package with ty"
run = "uv run --group typing ty check"

[tasks.lint]
description = "Run clippy lints in both feature configurations"
run = [
  "cargo clippy --all-targets -- -D warnings",
  "cargo clippy --all-targets --features python -- -D warnings",
]

[tasks.fmt]
description = "Format Rust source code"
run = "cargo fmt"

[tasks."fmt:check"]
description = "Check Rust formatting without modifying files"
run = "cargo fmt -- --check"

[tasks.changelog]
description = "Generate the full CHANGELOG.md"
run = "git cliff --output CHANGELOG.md"

[tasks."changelog:preview"]
description = "Preview unreleased changelog entries"
run = "git cliff --unreleased"

[tasks.ci]
description = "Run all CI checks locally"
depends = ["fmt:check", "lint", "test", "test:features", "test:python", "typecheck"]

[tasks.setup]
description = "Install pre-commit hooks via prek"
run = "prek install"

[tasks.cover]
description = "Generate code coverage report"
run = "cargo llvm-cov"

[tasks.bench]
description = "Run Python benchmarks comparing Markdown libraries"
run = "uv run --group bench pytest benchmarks/ --benchmark-only"
