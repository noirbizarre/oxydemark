[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "oxydemark"
version = "0.2.0"
description = "Extensible Markdown pipelines powered by Rust"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Axel H.", email = "noirbizarre@users.noreply.github.com" },
]
keywords = ["ast", "extensible", "markdown", "pipeline", "rust"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/noirbizarre/oxydemark"
Documentation = "https://noirbizarre.github.io/oxydemark/"
Repository = "https://github.com/noirbizarre/oxydemark"
Issues = "https://github.com/noirbizarre/oxydemark/issues"

[dependency-groups]
test = ["pytest>=9", "pytest-cov>=7"]
typing = ["ty>=0.0.58"]
bench = ["pytest>=9", "pytest-benchmark>=5", "markdown-it-py>=3", "markdown>=3"]
docs = ["zensical>=0.0.11", "mkdocstrings-python>=1.11"]

[tool.maturin]
# Activate the crate's `extension-module` feature, which enables the optional
# `pyo3` dependency, the binding layer, `pyo3/extension-module` linkage and
# `pyo3/abi3-py312` for the wheel build (issue #20). Thanks to abi3, a single
# `cp312-abi3` wheel per platform covers every supported Python (>=3.12).
features = ["extension-module"]
python-source = "python"
module-name = "oxydemark._core"
# Explicitly guarantee the PEP 561 marker and the hand-written stub are packaged
# in the wheel (OMEP-0008), independently of maturin's default packaging.
include = ["python/oxydemark/py.typed", "python/oxydemark/_core.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["oxydemark"]
branch = true

[tool.coverage.paths]
# `uv run` installs the project into the environment, so measurements are
# recorded against `site-packages`. Remap them onto the source tree, otherwise
# the uploaded report does not match the paths the Codecov components declare
# (OMEP-0012).
source = ["python/oxydemark", "*/site-packages/oxydemark"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ty.src]
include = ["python/oxydemark"]
