name: 🚀 Prepare Release

# gh-ship finds the run it dispatched by looking for this nonce. `gh workflow
# run` returns no run id, so this is not decorative: remove it and gh-ship
# cannot correlate the dispatch to a run.
run-name: 🚀 Prepare Release (ship:${{ inputs.ship_id }})

on:
  # Required. gh-ship starts this workflow through the API, which can only
  # start workflows declaring `workflow_dispatch`. Declaring only
  # `workflow_call` is the most common setup mistake.
  workflow_dispatch:
    inputs:
      ship_id:
        description: gh-ship correlation nonce
        required: true
        type: string
      dry_run:
        description: Produce the artifact but do not commit or push
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      ship_id:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_COLOR: 1

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest

    # SHIP_TOKEN lives only in the `release` environment. Preparing a release
    # is not a deployment, so this gates the secret without registering one;
    # release.yml is the deployment.
    environment:
      name: release
      deployment: false

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history *and* tags: git-cliff derives the next version from
          # the last tag, and a shallow clone has neither.
          fetch-depth: 0
          fetch-tags: true
          # gh-ship dispatches this workflow on a throwaway staging branch cut
          # from `main`, so the default checkout is already the right ref. Push
          # to HEAD, never to the release branch.
          #
          # The default GITHUB_TOKEN cannot trigger other workflows, so a
          # Release PR it authored would show no CI results.
          token: ${{ secrets.SHIP_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # Pins git-cliff and typos: a changelog tool that changed version between
      # releases would silently change our release notes.
      - uses: jdx/mise-action@v4
        with:
          cache: true

      # --- versioning and changelog: ours, not gh-ship's -------------------

      - name: Compute the next version
        id: version
        run: |
          set -euo pipefail

          # Compare against the last *tag*, not the version in the manifests.
          # Cargo.toml already carries the version being prepared, so comparing
          # to it would report "no change" for the very first release and make
          # bootstrapping impossible. The repository currently has no tags, so
          # git-cliff returns `[bump] initial_tag` (0.2.0) verbatim.
          last_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          next_tag="$(git cliff --bumped-version)"

          # This project tags without a `v` prefix (OMEP-0009), so the tag and
          # the version are the same string. They stay separate outputs because
          # the release artifact keeps them separate: the tag convention is a
          # project's own choice, and gh-ship never derives one from the other.
          {
            echo "tag=$next_tag"
            echo "version=$next_tag"
          } >> "$GITHUB_OUTPUT"

          if [ "$last_tag" = "$next_tag" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new releasable commits since ${last_tag:-the beginning}."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Releasing ${last_tag:-<nothing>} -> $next_tag"
          fi

      - name: Generate the changelog
        if: steps.version.outputs.changed == 'true'
        env:
          # git-cliff reads GITHUB_TOKEN, not GH_TOKEN. A missing scope
          # surfaces as 404 rather than 401, which is very confusing, so set it
          # explicitly.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git cliff --bump -o CHANGELOG.md

          # Release notes are scratch input for `jq --rawfile`, not a source
          # file. Keep them out of the worktree so `git add -A` cannot commit
          # them.
          git cliff --unreleased --bump --strip all -o "$RUNNER_TEMP/ship-notes.md"

          # The `## <version> - <date>` heading belongs to CHANGELOG.md. The
          # Release PR and the GitHub Release both carry the version in their
          # own title, so drop the first heading and the blank lines ahead of
          # it. The `0,/^## /` range stops at the first match, leaving later
          # `##` sections such as New Contributors alone.
          sed -i -e '0,/^## /{/^## /d}' -e '/./,$!d' "$RUNNER_TEMP/ship-notes.md"

      # Lockstep versioning (OMEP-0008): both manifests *and* both lockfiles
      # must land on the same version, or release.yml's version gate rejects
      # the tag.
      - name: Apply the version
        if: steps.version.outputs.changed == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          # Only the first `version =` belongs to [package] / [project].
          sed -i "0,/^version = \".*\"/s//version = \"$version\"/" Cargo.toml
          sed -i "0,/^version = \".*\"/s//version = \"$version\"/" pyproject.toml

          # Both lockfiles pin oxydemark itself, so they drift unless refreshed.
          cargo update --workspace
          uv lock

          # Fail loudly rather than opening a Release PR that the version gate
          # will reject hours later.
          grep -q "^version = \"$version\"$" Cargo.toml
          grep -q "^version = \"$version\"$" pyproject.toml

      - name: Commit and push
        if: steps.version.outputs.changed == 'true' && !inputs.dry_run
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || \
            git commit -m "chore(release): ${{ steps.version.outputs.version }}"
          git push origin HEAD

      # --- the protocol ----------------------------------------------------
      # https://noirbizarre.github.io/gh-ship/specifications/release-artifact/

      - name: Write the release artifact
        run: |
          set -euo pipefail
          if [ "${{ steps.version.outputs.changed }}" != "true" ]; then
            jq -n '{schemaVersion: 1, changed: false}' > ship.release.json
          else
            jq -n \
              --arg version "${{ steps.version.outputs.version }}" \
              --arg tag     "${{ steps.version.outputs.tag }}" \
              --rawfile notes "$RUNNER_TEMP/ship-notes.md" \
              '{
                "$schema": "https://noirbizarre.github.io/gh-ship/schema/release/v1.json",
                schemaVersion: 1,
                changed: true,
                version: $version,
                tag: $tag,
                release: { notes: $notes }
              }' > ship.release.json
          fi
          cat ship.release.json

      # Validating here turns a protocol mistake into a red workflow with a
      # precise error, instead of a confusing failure in gh-ship later.
      - name: Validate the release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install noirbizarre/gh-ship
          gh ship validate ship.release.json

      - uses: actions/upload-artifact@v4
        with:
          name: ship-release
          path: ship.release.json
          if-no-files-found: error
