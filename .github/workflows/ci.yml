name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `RUSTFLAGS` is deliberately *not* set workflow-wide: it also applies to
# third-party crates built from source (maturin in the `sdist` job), where
# upstream warnings would fail our CI. It is set per job on the jobs that
# only compile this crate.
env:
  CARGO_TERM_COLOR: always
  FORCE_COLOR: 1

jobs:
  check:
    name: Check (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

  test:
    name: Test (${{ matrix.toolchain }})
    env:
      RUSTFLAGS: -Dwarnings
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      - uses: taiki-e/install-action@cargo-llvm-cov

      # `--features python` links libpython through the `auto-initialize`
      # dev-dependency, so an interpreter must be available.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Both configurations feed the same profile data: the binding layer
      # (`src/python.rs`) is compiled out of the default build and would
      # otherwise be reported as entirely uncovered (OMEP-0012).
      - name: Run tests (no python feature)
        run: cargo llvm-cov nextest --profile ci --no-report

      - name: Run tests (python feature)
        run: cargo llvm-cov nextest --profile ci --no-report --features python

      - name: Build the coverage report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      # A single leg uploads: the nightly leg proves the code still compiles
      # and passes there, but its report would be identical and would only add
      # latency to Codecov's `after_n_builds` bookkeeping.
      - name: Upload coverage to Codecov
        if: matrix.toolchain == 'stable'
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          flags: rust

      - name: Upload test results to Codecov
        if: ${{ matrix.toolchain == 'stable' && !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          directory: target/nextest/ci
          report_type: test_results

  build:
    name: Build
    env:
      RUSTFLAGS: -Dwarnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

  package:
    name: Package (cargo publish --dry-run)
    env:
      RUSTFLAGS: -Dwarnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Surfaces the exact file list shipped to crates.io -- and, because
      # maturin's sdist generator reads it, the PyPI sdist file list too
      # (OMEP-0009).
      - name: List packaged files
        run: cargo package --list

      # Full packaging plus a verification build from the packaged tarball, so
      # a missing `include` entry fails on the pull request rather than on the
      # release tag.
      - name: Dry-run publish
        run: cargo publish --dry-run --locked

  python:
    name: Python wheel (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python tests
        run: >-
          uv run --group test pytest -q
          --cov --cov-report=xml --junitxml=junit.xml

      # A single interpreter uploads: the other legs run the same suite over the
      # same sources, so their reports would be identical (OMEP-0012).
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: python

      - name: Upload test results to Codecov
        if: ${{ matrix.python-version == '3.12' && !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: junit.xml
          report_type: test_results

      - name: Type-check public API (ty)
        run: uv run --group typing ty check

      - name: Build wheel
        run: uv build
        env:
          MATURIN_PEP517_ARGS: "--profile release"

      # Same gate as the release workflow: abi3 tagging plus the packaged
      # `py.typed`/stub, checked on every pull request instead of at tag time.
      - name: Verify wheel contents
        run: python3 .github/scripts/check_wheel.py dist

      - name: Install and smoke-test
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import oxydemark; print(oxydemark.markdown_to_html('hello'))"

  # The PyPI sdist file list is derived from `cargo package --list`, so a
  # tightened `include` in `Cargo.toml` can produce a tarball that no longer
  # builds. Catch that on the pull request rather than on the release tag
  # (OMEP-0009).
  sdist:
    name: Python sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build sdist
        run: uvx --from "maturin>=1.8,<2.0" maturin sdist --out dist

      - name: Install sdist and smoke-test
        run: |
          set -euo pipefail
          uv venv /tmp/sdist-smoke
          uv pip install --python /tmp/sdist-smoke/bin/python --no-binary :all: dist/*.tar.gz
          /tmp/sdist-smoke/bin/python -c "import oxydemark; print(oxydemark.markdown_to_html('hello'))"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build documentation site
        run: uv run --group docs zensical build --clean

      - name: Build rustdoc reference
        run: cargo doc --no-deps

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff derives the next version from the last tag; a shallow
          # clone has neither history nor tags.
          fetch-depth: 0
          fetch-tags: true

      # mise provides both git-cliff *and* typos. The latter is not optional:
      # `cliff.toml` runs `typos --write-changes -` as a commit preprocessor,
      # so git-cliff fails outright without it on PATH.
      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Spell-check
        run: typos

      # Renders exactly what the Release PR and the GitHub Release will carry,
      # so a template regression fails here rather than mid-release.
      - name: Validate the release notes
        run: git cliff --unreleased --bump --strip all
