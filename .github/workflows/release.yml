name: 📦 Publish Release

# gh-ship correlates the run it dispatched via this nonce. `gh workflow run`
# returns no run id, so removing it breaks the correlation.
run-name: 📦 Publish Release (ship:${{ inputs.ship_id }})

# Dispatched by `gh ship release` *after* it has tagged the merge commit and
# created the GitHub Release as a draft (OMEP-0009). That ordering is what lets
# the wheels and sdist be attached before anyone watching the repository is
# notified; gh-ship undrafts the release once this workflow succeeds.
#
# CAUTION: this file must keep the name `release.yml`. The crates.io and PyPI
# Trusted Publishers are bound to the workflow *filename*, and renaming it
# makes both registries reject the OIDC token.
on:
  workflow_dispatch:
    inputs:
      ship_id:
        description: gh-ship correlation nonce
        required: true
        type: string
      tag:
        description: The tag being released
        required: true
        type: string

  workflow_call:
    inputs:
      ship_id:
        required: true
        type: string
      tag:
        required: true
        type: string

# Trusted Publishing (OMEP-0009, option A2): the workflow mints short-lived
# crates.io and PyPI tokens from GitHub's OIDC identity. No registry secret is
# stored. `contents: write` is for attaching assets to the draft release.
permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_COLOR: 1

jobs:
  # Gate: the tag, Cargo.toml and pyproject.toml must agree on one version
  # (OMEP-0008 lockstep versioning). Every publish job hangs off this. It now
  # catches a faulty `prepare-release` run rather than a bad manual tag.
  version:
    name: Verify version consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Check tag, Cargo.toml and pyproject.toml agree
        id: check
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          py_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag:            $tag"
          echo "Cargo.toml:     $cargo_version"
          echo "pyproject.toml: $py_version"
          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$py_version" ]; then
            echo "::error::Version mismatch: tag=$tag Cargo.toml=$cargo_version pyproject.toml=$py_version"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  crates-io:
    name: Publish to crates.io
    needs: version
    runs-on: ubuntu-latest
    # Must match the environment bound to the crates.io Trusted Publisher.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          # gh-ship has already created the tag, so check out exactly what is
          # being released rather than a branch tip.
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Exchanges the job's OIDC token for a short-lived crates.io token; the
      # action's post step revokes it when the job ends.
      - name: Authenticate with crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # One `cp312-abi3` wheel per platform: the crate's `extension-module` feature
  # pulls `pyo3/abi3-py312`, so a single artifact covers every supported Python
  # (>=3.12) and the matrix only varies by target (OMEP-0009, option W2).
  wheels:
    name: Wheel (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: auto
          - runner: macos-13
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # abi3 floor: building with the oldest supported interpreter is what makes
      # the resulting wheel usable on 3.12+.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: true

      # Guards the two acceptance criteria that a wheel can silently break:
      # the PEP 561 marker plus the stub must be packaged (OMEP-0008), and the
      # artifact must really be abi3 rather than a version-locked `cp312` wheel.
      - name: Verify wheel contents
        shell: bash
        run: python3 .github/scripts/check_wheel.py dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  # The sdist lets platforms outside the matrix build from source. It is
  # generated from `cargo package --list` (maturin's default
  # `sdist-generator = "cargo"`), so it is only as complete as the `include`
  # allow-list in `Cargo.toml` -- hence the install-and-import check.
  sdist:
    name: Source distribution
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Install sdist and smoke-test
        run: |
          set -euo pipefail
          python -m venv /tmp/sdist-smoke
          /tmp/sdist-smoke/bin/pip install --no-binary :all: dist/*.tar.gz
          /tmp/sdist-smoke/bin/python -c \
            "import oxydemark; print(oxydemark.markdown_to_html('hello'))"

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  pypi:
    name: Publish to PyPI
    needs: [version, wheels, sdist]
    runs-on: ubuntu-latest
    # Must match the environment bound to the PyPI Trusted Publisher. Until the
    # first upload this is a *pending* publisher, which is how a project that
    # does not yet exist on PyPI is bootstrapped without a manual release.
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      # Trusted Publishing (OMEP-0009, option A2): authenticated with the job's
      # OIDC identity, no `PYPI_API_TOKEN` secret. Attestations are generated by
      # default.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  # Attaches the same artifacts to the GitHub Release that gh-ship created as a
  # draft. This must live in this workflow rather than a separate one: gh-ship
  # undrafts the release only once this run succeeds, so anything uploaded
  # afterwards would arrive after subscribers were notified.
  assets:
    name: Attach release assets
    needs: [version, wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # This one *is* a deployment: it is what makes the release tangible. The
    # `url` registers it in the repository's deployment history.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Upload assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ inputs.tag }}" dist/* --clobber
