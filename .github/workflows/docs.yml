name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment, without cancelling an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  FORCE_COLOR: 1

jobs:
  deploy:
    name: Build and deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # setup-uv stopped publishing major/minor tags at v8, so the full
      # version is the only pin available upstream.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Build documentation site
        run: uv run --group docs zensical build --clean

      - name: Build rustdoc reference
        run: cargo doc --no-deps

      - name: Nest the rustdoc reference under the site
        run: |
          rm -rf site/rust
          cp -R target/doc site/rust

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/deploy-pages@v5
        id: deployment
